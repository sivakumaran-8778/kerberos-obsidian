<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Obsidian Protocol - Zero-Trust Decentralized Digital Provenance & Secure P2P Mesh">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Obsidian Protocol">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Obsidian Protocol</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Zero-Trust Crypto Engine Integration -->
  <script type="module">
    import { runZkRedactMockUI } from './zkRedactEngine.js';
    import './provenanceVerifier.js';

    
    // Inject Floating Action Buttons to trigger the mocked JS UI directly over Flutter
    const fabContainer = document.createElement('div');
    fabContainer.style.position = 'fixed';
    fabContainer.style.bottom = '20px';
    fabContainer.style.left = '20px';
    fabContainer.style.zIndex = '999999';
    fabContainer.style.display = 'flex';
    fabContainer.style.flexDirection = 'column';
    fabContainer.style.gap = '10px';
    
    const btnZk = document.createElement('button');
    btnZk.innerText = 'Run zk-Redact Mock Dashboard';
    btnZk.style.padding = '12px 20px';
    btnZk.style.backgroundColor = '#34D399';
    btnZk.style.color = '#000';
    btnZk.style.border = 'none';
    btnZk.style.borderRadius = '8px';
    btnZk.style.fontWeight = 'bold';
    btnZk.style.cursor = 'pointer';
    btnZk.style.boxShadow = '0 4px 6px rgba(0,0,0,0.3)';
    
    btnZk.onclick = () => {
      runZkRedactMockUI();
    };

    fabContainer.appendChild(btnZk);
    document.body.appendChild(fabContainer);
  </script>
</body>
</html>
