[package]
name = "core"
version = "0.1.0"
edition = "2021"
description = "Project Kerberos C2PA engine and Rust core."

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# C2PA Rust SDK (Official)
c2pa = "0.32"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Hashing
sha2 = "0.10"
ed25519-dalek = "2.0"

# Error handling
anyhow = "1.0"

# FFI utilities
libc = "0.2"

# Concurrency for background thread processing if needed internally
tokio = { version = "1.0", features = ["full"] }

[build-dependencies]
# Build scripts for compiling C header files (cbindgen)
cbindgen = "0.26"
